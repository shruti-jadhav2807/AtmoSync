version: 2

models:
  - name: stg_sensor_readings
    description: "Cleaned, standardized 1:1 view over public.sensor_readings."
    tests:
      - unique_combination:
          arguments:
            combination_of_columns:
              - container_id
              - timestamp_utc
    columns:
      - name: reading_id
        tests:
          - unique
          - not_null
      - name: timestamp_utc
        tests:
          - not_null
      - name: container_id
        tests:
          - not_null
      - name: product
        description: "Lowercased product name. Accepted values reflect the current 5-product fleet (configurable via var('accepted_products'))."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('accepted_products') }}"
      - name: route
        tests:
          - not_null
      - name: temperature_c
        tests:
          - not_null
      - name: humidity_pct
        tests:
          - not_null
      - name: vibration_g
        tests:
          - not_null
