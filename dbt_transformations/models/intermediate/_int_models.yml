version: 2

models:
  - name: int_container_telemetry_enriched
    description: "Telemetry enriched with per-container sequence order, 1h deltas, and assumed 6-reading trailing averages."
    tests:
      - unique_combination:
          arguments:
            combination_of_columns:
              - container_id
              - timestamp_utc
    columns:
      - name: reading_id
        tests:
          - unique
          - not_null
      - name: container_id
        tests:
          - not_null
      - name: timestamp_utc
        tests:
          - not_null
      - name: reading_seq_num
        tests:
          - not_null

  - name: int_container_baseline_drift
    description: "Relative drift and z-scores against each container's configurable initial baseline window (statistical anomaly heuristic, NOT confirmed spoilage)."
    tests:
      - unique_combination:
          arguments:
            combination_of_columns:
              - container_id
              - timestamp_utc
    columns:
      - name: reading_id
        tests:
          - unique
          - not_null
      - name: container_id
        tests:
          - not_null
      - name: timestamp_utc
        tests:
          - not_null
      - name: baseline_sample_count
        tests:
          - not_null
      - name: is_statistical_drift_anomaly
        tests:
          - not_null
