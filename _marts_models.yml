version: 2

models:
  - name: dim_containers
    description: "Container dimension table (one row per container_id) for Apache Superset filters and joins."
    columns:
      - name: container_id
        tests:
          - unique
          - not_null
      - name: product
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('accepted_products') }}"
      - name: route
        tests:
          - not_null
      - name: total_readings
        tests:
          - not_null

  - name: fct_sensor_readings
    description: "Fact table at grain (container_id, timestamp_utc) for Superset time-series analytics."
    tests:
      - unique_combination:
          arguments:
            combination_of_columns:
              - container_id
              - timestamp_utc
    columns:
      - name: reading_id
        tests:
          - unique
          - not_null
      - name: container_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_containers')
                field: container_id
      - name: timestamp_utc
        tests:
          - not_null
      - name: temperature_c
        tests:
          - not_null
      - name: humidity_pct
        tests:
          - not_null
      - name: vibration_g
        tests:
          - not_null
      - name: is_statistical_drift_anomaly
        tests:
          - not_null

  - name: mart_container_health_summary
    description: "Container-level summary table for Superset KPI cards and drift monitoring (statistical anomaly heuristic, NOT confirmed spoilage)."
    columns:
      - name: container_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_containers')
                field: container_id
      - name: total_readings
        tests:
          - not_null
      - name: latest_temp_c
        tests:
          - not_null
      - name: baseline_avg_temp_c
        tests:
          - not_null
      - name: statistical_drift_anomaly_count
        tests:
          - not_null
