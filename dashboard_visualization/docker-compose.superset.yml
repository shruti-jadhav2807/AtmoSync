name: atmosync-superset

services:
  superset:
    build:
      context: ..
      dockerfile: dashboard_visualization/Dockerfile.superset
    image: atmosync-superset:4.1.1
    container_name: atmosync-superset
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      SERVER_WORKER_AMOUNT: "1"
      SERVER_THREADS_AMOUNT: "4"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - atmosync_superset_home:/app/superset_home
    mem_limit: 1280m
    mem_reservation: 384m
    cpus: "1.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  atmosync_superset_home:
    name: atmosync_superset_home
