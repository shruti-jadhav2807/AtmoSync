version: 2

sources:
  - name: atmosync_raw
    description: "Read-only raw sensor telemetry table populated by Phase 1 CSV ingestion and Phase 2 Kafka consumer."
    schema: public
    tables:
      - name: sensor_readings
        description: "Raw container telemetry readings preserved untouched by dbt."
        columns:
          - name: reading_id
            tests:
              - unique
              - not_null
          - name: timestamp_utc
            tests:
              - not_null
          - name: container_id
            tests:
              - not_null
          - name: product
            tests:
              - not_null
          - name: route
            tests:
              - not_null
          - name: temperature_c
            tests:
              - not_null
          - name: humidity_pct
            tests:
              - not_null
          - name: vibration_g
            tests:
              - not_null
